<div id="countdownBox" style="
  background: linear-gradient(135deg, #0a1a0a, #143814);
  border: 2px solid #7CFC00;
  border-radius: 14px;
  padding: 20px;
  margin: 20px auto;
  max-width: 500px;
  text-align: center;
  font-family: sans-serif;
  box-shadow: 0 0 25px rgba(124,252,0,0.25);
">
  <div style="color:#7CFC00; font-size:14px; font-weight:bold; letter-spacing:1px; margin-bottom:10px;">
    ⏳ COUNTDOWN TO THE MARATHON
  </div>
  <div style="display:flex; justify-content:center; gap:16px; flex-wrap:wrap;">
    <div>
      <div id="cd-days" style="color:#fff; font-size:32px; font-weight:bold;">00</div>
      <div style="color:#aaa; font-size:12px;">DAYS</div>
    </div>
    <div>
      <div id="cd-hours" style="color:#fff; font-size:32px; font-weight:bold;">00</div>
      <div style="color:#aaa; font-size:12px;">HOURS</div>
    </div>
    <div>
      <div id="cd-minutes" style="color:#fff; font-size:32px; font-weight:bold;">00</div>
      <div style="color:#aaa; font-size:12px;">MINUTES</div>
    </div>
    <div>
      <div id="cd-seconds" style="color:#fff; font-size:32px; font-weight:bold;">00</div>
      <div style="color:#aaa; font-size:12px;">SECONDS</div>
    </div>
  </div>
  <div style="color:#7CFC00; font-size:13px; margin-top:12px;">14th - 16th August 2026</div>
</div>

<script>
  (function() {
    const targetDate = new Date("2026-08-14T00:00:00Z").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = targetDate - now;

      if (distance < 0) {
        document.getElementById('countdownBox').innerHTML =
          '<div style="color:#7CFC00; font-size:18px; font-weight:bold;">🎉 THE MARATHON HAS BEGUN!</div>';
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
      document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('cd-minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('cd-seconds').textContent = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  })();
</script>
